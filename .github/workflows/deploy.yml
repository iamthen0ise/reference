name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .site/.nvmrc
          cache: npm
          cache-dependency-path: .site/package-lock.json

      # Сборка пререндерит mermaid через Playwright Chromium, ему нужны системные библиотеки
      - name: Install
        run: make init PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      - name: Test
        run: make test

      - name: Check and build
        run: make check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
