description: >-
  Дубли от ретрая в приложении: у лидера теряются ответы раннеру (обрыв в одну сторону), запись при этом доходит и пишется.
  Клиент по таймауту отдаёт приложению ошибку (aiokafka сам неидемпотентный пакет по таймауту не повторяет), приложение
  отправляет тот же seq заново (producer.app_retries), и после снятия обрыва в логе дубль. Ожидаем «задвоено» не ноль.
  Идемпотентный продюсер (--set producer.idempotence=true) в этом сценарии даёт «задвоено 0», но не потому, что убирает дубль ретрая
  приложения: он сам повторяет пакет по таймауту с тем же номером последовательности, брокер отбрасывает повтор, приложению ошибка
  не приходит, и своего повтора нет. Если приложение всё же пошлёт тот же seq новым send(), для брокера это новая запись: дубль
  уйдёт только идемпотентностью обработчика (ключ в БД), см. статью.
article: "[[Продюсер Kafka на практике]]"
topic:
  partitions: 1
  replication: 3
  configs:
    min.insync.replicas: 2
producer:
  acks: all
  idempotence: false
  rate: 50
  seconds: 20
  request_timeout_ms: 3000
  app_retries: 5
observers: [read_committed]
settle_seconds: 40
faults:
  - at: 3
    cut: leader(p0)
    peer: runner
    one_way: true
  # Обрыв 8 с: хватает на два таймаута запроса, повтор после heal проходит.
  - at: 11
    heal: all
